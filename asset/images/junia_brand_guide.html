<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junia Luxury Logo Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A96E;
            --black: #1A1A1A;
            --cream: #FDFBF7;
            --white: #FFFFFF;
        }
        body {
            background-color: var(--cream);
            color: var(--black);
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            padding: 40px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }
        .card {
            background: var(--white);
            padding: 60px;
            border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card.dark {
            background: var(--black);
            color: var(--white);
        }
        .label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: #AAA;
        }
        .logo-display {
            width: 100%;
            height: auto;
            max-width: 250px;
        }
        .branding-section {
            background: #111;
            color: white;
            padding: 120px 0;
            text-align: center;
        }
        .mockup-grid {
            display: flex;
            justify-content: center;
            gap: 80px;
            flex-wrap: wrap;
            margin-top: 60px;
        }
        .tag-mockup {
            width: 180px;
            height: 300px;
            background: var(--white);
            color: var(--black);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .tag-mockup::before {
            content: '';
            position: absolute;
            top: 20px;
            width: 15px;
            height: 15px;
            background: var(--cream);
            border-radius: 50%;
            border: 1px solid #ddd;
        }
        .tag-mockup .line {
            width: 40px;
            height: 1px;
            background: #ddd;
            margin: 20px 0;
        }
        .box-mockup {
            width: 300px;
            height: 150px;
            background: var(--white);
            border: 1px solid #F0E6D2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-weight: 400;
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-size: 0.8rem;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <header>
        <h1>JUNIA</h1>
        <p class="subtitle">Brand Identity Design</p>
    </header>

    <div class="container">
        <div class="grid">
            <!-- Icon Gold -->
            <div class="card">
                <div class="label">Icon (Signature J)</div>
                <img src="junia_icon_gold.svg" class="logo-display" alt="Junia Gold Icon">
            </div>

            <!-- Full Logo Gold -->
            <div class="card">
                <div class="label">Primary Logo</div>
                <img src="junia_logo_full_gold.svg" class="logo-display" alt="Junia Full Logo">
            </div>

            <!-- Icon Black -->
            <div class="card dark">
                <div class="label">Monochrome</div>
                <img src="junia_icon_black.svg" class="logo-display" style="filter: brightness(0) invert(1);" alt="Junia Black Icon">
            </div>
        </div>
    </div>

    <div class="branding-section">
        <div class="container">
            <div class="label" style="color: var(--gold)">Package & Labels</div>
            <div class="mockup-grid">
                <!-- Tag Mockup -->
                <div class="tag-mockup">
                    <img src="junia_icon_gold.svg" width="60" alt="Icon">
                    <div style="font-size: 1.2rem; letter-spacing: 2px; margin-top: 10px;">JUNIA</div>
                    <div class="line"></div>
                    <div style="font-family: 'Montserrat'; font-size: 0.6rem; letter-spacing: 2px; opacity: 0.5;">AUTUMN / WINTER</div>
                    <div style="margin-top: auto; font-family: 'Montserrat'; font-size: 0.8rem;">$495.00</div>
                </div>

                <!-- Box Mockup -->
                <div class="box-mockup">
                    <img src="junia_logo_full_gold.svg" width="220" alt="Full Logo">
                </div>
            </div>
        </div>
    </div>

    <footer style="padding: 60px; text-align: center; color: #888; font-family: 'Montserrat'; font-size: 0.7rem; letter-spacing: 2px;">
        &copy; 2026 JUNIA COUTURE. ALL RIGHTS RESERVED.
    </footer>
</body>
</html>
