<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junia Logo Render</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A96E;
            --black: #1A1A1A;
            --cream: #F9F7F2;
        }
        body {
            background-color: var(--cream);
            color: var(--black);
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        .section {
            margin-bottom: 80px;
            text-align: center;
        }
        .logo-box {
            background: white;
            padding: 60px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px;
        }
        .dark-box {
            background: var(--black);
            color: white;
        }
        h2 {
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1rem;
            margin-bottom: 40px;
            color: #888;
        }
        .junia-text {
            font-size: 3rem;
            letter-spacing: 0.1em;
            margin-top: 10px;
            font-weight: 400;
        }
        .tagline {
            font-style: italic;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.6;
        }
        .svg-icon {
            width: 150px;
            height: 150px;
        }
        .packaging {
            width: 300px;
            height: 400px;
            background: white;
            border: 1px solid #eee;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .ribbon {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 40px;
            background: var(--black);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h2>Icon Concept (Stylized J)</h2>
            <div class="logo-box">
                <svg viewBox="0 0 100 100" class="svg-icon">
                    <path d="M70,30 C65,20 50,15 45,25 C40,35 45,55 45,65 C45,80 35,90 20,85 C10,82 5,75 15,70 C25,65 40,75 45,75 C55,75 70,60 75,40 C80,20 60,10 40,15" 
                          fill="none" stroke="#C9A96E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="logo-box dark-box">
                <svg viewBox="0 0 100 100" class="svg-icon">
                    <path d="M70,30 C65,20 50,15 45,25 C40,35 45,55 45,65 C45,80 35,90 20,85 C10,82 5,75 15,70 C25,65 40,75 45,75 C55,75 70,60 75,40 C80,20 60,10 40,15" 
                          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <div class="section">
            <h2>Full Logo</h2>
            <div class="logo-box">
                <svg viewBox="0 0 100 80" width="200" height="160">
                    <path d="M70,20 C65,10 50,5 45,15 C40,25 45,45 45,55 C45,70 35,80 20,75 C10,72 5,65 15,60 C25,55 40,65 45,65 C55,65 70,50 75,30 C80,10 60,0 40,5" 
                          fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="junia-text">JUNIA</div>
                <div class="tagline">Couture</div>
            </div>
        </div>

        <div class="section">
            <h2>Packaging Mockup</h2>
            <div class="packaging">
                <div class="ribbon"></div>
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <path d="M70,30 C65,20 50,15 45,25 C40,35 45,55 45,65 C45,80 35,90 20,85 C10,82 5,75 15,70 C25,65 40,75 45,75 C55,75 70,60 75,40 C80,20 60,10 40,15" 
                          fill="none" stroke="#C9A96E" stroke-width="1.5" />
                </svg>
                <div class="junia-text" style="font-size: 1.5rem;">JUNIA</div>
            </div>
        </div>
    </div>
</body>
</html>
